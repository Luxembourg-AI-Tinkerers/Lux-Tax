packages:
  - 'packages/*'
  - 'apps/api'
  - 'apps/web'
  # The mobile client was never in the workspace, so `pnpm install` never tried
  # to resolve it and its tree could only be assembled by hand. It uses the same
  # workspace packages and the same TypeScript version as the web app.
  - 'apps/mobile'
allowBuilds:
  '@prisma/engines': true
  argon2: true
  prisma: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - next@16.4.6
# Patched versions for the transitive advisories Dependabot reported. Each entry
# targets the exact copy that was vulnerable, so a parent that genuinely needs
# an older major keeps its own copy. `pnpm audit` and `.tools/audit_vulns.mjs`
# prove the result; any notes on resolved/open packages live in
# docs/dependency-security.md.
overrides:
  '@fastify/static@10.1.4': 10.1.12
  '@xmldom/xmldom@0.7.13': 0.9.12
  deepmerge-ts@7.1.5: 8.0.2
  effect@3.20.0: 3.22.5
  fast-uri@3.1.8: 3.1.9
  fast-uri@4.2.1: 4.2.3
  fastify@5.12.5: 5.12.8
  glob@10.5.0: 14.0.6
  handlebars@4.7.9: 4.7.10
  image-size@1.2.1: 2.1.0
  ip-address@10.7.2: 10.7.6
  mysql2@3.15.3: 3.24.6
  postcss@8.4.49: 8.5.32
  postcss@8.5.23: 8.5.32
  postcss@8.5.28: 8.5.32
  qs@6.16.0: 6.17.1
  sharp@0.35.4: 0.35.5
  source-map-js@1.2.1: 1.2.2
  sucrase@3.35.0: 3.35.1
  tar@6.2.1: 7.5.22
  uuid@7.0.3: 11.1.1
  uuid@8.3.2: 11.1.1
